<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Volumetric ASCII Christmas Tree, Santa & Snoopy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="christmas-title" class="christmas-title">
      <svg viewBox="0 0 600 170">
        <defs>
          <path id="christmas-curve" d="M 35 145 Q 300 -45 565 145" />
        </defs>

        <text class="christmas-letters">
          <textPath
            href="#christmas-curve"
            startOffset="50%"
            text-anchor="middle"
          >
            ✦ MERRY CHRISTMAS ✦
          </textPath>
        </text>
      </svg>
    </div>

    <div class="logo-corner">
      <div class="logo-title">MERRY CHRISTMAS</div>
      <div class="hud-stats" id="hud-stats">t: 0.00s | voxels: 0 | rot: 0°</div>
    </div>

    <div class="countdown-corner">
      <div class="countdown-label">🎄 XMAS COUNTDOWN</div>
      <div class="countdown-timer" id="countdown-timer">00d 00h 00m 00s</div>
    </div>

    <audio id="bg-audio" autoplay loop preload="auto">
      <source
        id="audio-source"
        src="songList/Ariana Grande – Santa Tell Me.mp3"
        type="audio/mpeg"
      />
    </audio>

    <div class="controls">
      <button id="btn-replay">Replay Build</button>
      <button id="btn-santa">Santa Flyby</button>
      <div class="character-picker">
        <button
          id="btn-characters"
          type="button"
          aria-expanded="false"
          aria-controls="character-menu"
        >
          Pop Characters
        </button>

        <div class="character-menu" id="character-menu">
          <div class="character-menu-title">Choose your characters</div>
          <label
            ><input type="checkbox" data-character="snoopy" /> Snoopy &
            Woodstock</label
          >
          <label
            ><input type="checkbox" data-character="pooh" /> Winnie the
            Pooh</label
          >
          <label
            ><input type="checkbox" data-character="piglet" /> Piglet</label
          >
          <label
            ><input type="checkbox" data-character="tigger" /> Tigger</label
          >
          <label
            ><input type="checkbox" data-character="eeyore" /> Eeyore</label
          >
          <label><input type="checkbox" data-character="kanga" /> Kanga</label>
          <label><input type="checkbox" data-character="roo" /> Roo</label>
        </div>
      </div>
      <button id="btn-snow">Snow: ON</button>

      <div class="song-selector">
        <label for="song-select">Song:</label>
        <select id="song-select">
          <option value="songList/Ariana Grande – Santa Tell Me.mp3">
            Santa Tell Me
          </option>
          <option
            value="songList/Mariah Carey - All I Want For Christmas Is You (Lyrics).mp3"
          >
            All I Want For Christmas
          </option>
          <option value="songList/Wham - Last Christmas (Lyrics).mp3">
            Last Christmas
          </option>
          <option value="songList/Bobby Helms - Jingle Bell Rock.mp3">
            Jingle Bell Rock
          </option>

          <option
            value="songList/my daisy「 Lyrics Video 」- RISA NARISA - (original Kbps).mp3"
          >
            My Daisy
          </option>
          <option
            value="songList/ตกหลุมรักรอบที่ล้าน (love u 1m) 「Official Video」 l Kinkaworn x Bell Warisara - (original Kbps).mp3"
          >
            ตกหลุมรักรอบที่ล้าน
          </option>
          <option
            value="songList/เอเวอร์รี่ติง จิงเกอเบล - BALLCHON & Earth Yamamoto x TikTok (Prod. by Wine Neti) _ OFFICIAL MV - (original Kbps).mp3"
          >
            เอเวอร์รี่ติง จิงเกอเบล
          </option>
        </select>
      </div>

      <button id="btn-music">Music: OFF</button>

      <label class="speed-control">
        <span>Spin</span>
        <input
          type="range"
          id="spin-speed"
          min="0"
          max="2.5"
          step="0.1"
          value="0.6"
        />
      </label>
    </div>

    <!-- <div class="hint">
      Drag to rotate 3D camera • Grand Scale Volumetric Voxel Build
    </div> -->

    <script src="index.js"></script>
    <script src="welcomeGate.js"></script>
  </body>
</html>
